---
name: "Cleanup Stale Container Images"

"on":
  schedule:
    # Sundays at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview candidate deletions without deleting anything."
        type: boolean
        required: false
        default: true
      cut-off:
        description: "Minimum age an untagged image version must reach before it is eligible for deletion (e.g. 30d, 4w 2d)."
        type: string
        required: false
        default: "30d"

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Stale Container Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Untagged-only tag-selection and the fixed account/image-names below are
      # intentionally not exposed as workflow_dispatch inputs: changing either
      # would delete tagged (including per-commit SHA) versions or reach
      # outside this package, both of which the team explicitly ruled out.
      # keep-n-most-recent is left at its default (0, i.e. unused) for the
      # same reason. snok/container-retention-policy protects multi-arch
      # child manifests still referenced by a retained parent automatically,
      # with no input here overriding that behavior.
      - name: Delete stale untagged image versions
        id: container-retention-policy
        # Invoked as a direct container reference, pinned by digest, rather
        # than via the `snok/container-retention-policy@<sha>` action alias:
        # that alias only pins the action's metadata commit, while the
        # metadata itself points at the mutable `v3.1.0` container tag it
        # actually executes. Since this container now holds a token capable
        # of deleting organization packages, pinning by digest closes the
        # gap where retagging upstream could substitute a different image.
        uses: docker://ghcr.io/snok/container-retention-policy@sha256:884037f146d6ef574b61fbcc59bef490f887322e6b9dc2eefcf364cb4e9b4112  # v3.1.0
        # A raw `docker://` reference has no action.yaml, so there is no
        # `with:`-to-CLI-flag mapping to rely on: the image's entrypoint is a
        # Rust CLI that only understands `--flag=value` arguments. Inputs are
        # passed via `with.args`, GitHub's documented mechanism for a Docker
        # container step's args (see "jobs.<job_id>.steps[*].with.args" in the
        # workflow syntax reference), which forwards this string to the
        # container's ENTRYPOINT. cut-off is double-quoted because its value
        # may contain a space (e.g. "4w 2d"). --image-tags and --shas-to-skip
        # are passed empty rather than omitted: upstream's action.yaml always
        # forwards both flags to the CLI (empty when its own inputs are
        # unset), and the CLI's arg parser requires the flags to be present,
        # even with an empty value — confirmed by a live dry-run failing with
        # "the following required arguments were not provided: --image-tags
        # <IMAGE_TAGS>, --shas-to-skip <SHAS_TO_SKIP>" when they were omitted.
        env:
          RUST_LOG: container_retention_policy=INFO
        with:
          # The default job GITHUB_TOKEN can delete package versions as long
          # as `image-names` is an exact string (not a wildcard), which it is
          # here — no separate PAT is needed. Requires the job-level
          # `permissions: packages: write` above.
          #
          # Scheduled runs default to dry-run:true for now: the package has
          # ~15,000 existing untagged versions, so the first unattended
          # Sunday run would face the whole accumulated backlog rather than
          # the small weekly slice a steady-state run sees, risking a
          # GHCR rate-limit failure with no one watching. Flip this fallback
          # to 'false' once a maintainer has reviewed a manual dry-run
          # preview (or drained the backlog manually) and confirmed the
          # candidate count is safe to delete unattended.
          args: >-
            --account=linuxfoundation
            --image-names=lfx-v2-campaign-service/campaign-service
            --image-tags=
            --shas-to-skip=
            --tag-selection=untagged
            --token=${{ secrets.GITHUB_TOKEN }}
            --cut-off="${{ github.event.inputs.cut-off || '30d' }}"
            --dry-run=${{ github.event.inputs.dry-run || 'true' }}

      - name: Write run summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'true' }}
          CUT_OFF: ${{ github.event.inputs.cut-off || '30d' }}
          DELETED: ${{ steps.container-retention-policy.outputs.deleted }}
          FAILED: ${{ steps.container-retention-policy.outputs.failed }}
        run: |
          {
            echo "### Container image cleanup"
            echo ""
            echo "- Trigger: \`$TRIGGER\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Cut-off: \`$CUT_OFF\`"
            echo "- Deleted: ${DELETED:-(none)}"
            echo "- Failed: ${FAILED:-(none)}"
          } >> "$GITHUB_STEP_SUMMARY"
