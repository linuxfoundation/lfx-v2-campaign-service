---
name: "Cleanup Stale Container Images"

"on":
  schedule:
    # Sundays at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview candidate deletions without deleting anything."
        type: boolean
        required: false
        default: true
      cut-off:
        description: "Minimum age an image version must reach before it is eligible for deletion (e.g. 30d, 4w 2d)."
        type: string
        required: false
        default: "30d"

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Stale Container Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # tag-selection and the fixed account/image-names below are intentionally
      # not exposed as workflow_dispatch inputs. tag-selection is `both`:
      # per-commit SHA-tagged versions from PR/main builds are now in scope
      # (see the --image-tags note below for what still protects releases and
      # the current main build), but reaching outside this package is still
      # ruled out, so account/image-names stay fixed. keep-n-most-recent is
      # left at its default (0, i.e. unused): the cut-off already excludes
      # anything younger than the configured age, so an additional
      # most-recent-N carve-out wouldn't protect anything cut-off doesn't.
      # snok/container-retention-policy protects multi-arch child manifests
      # still referenced by a retained parent automatically, with no input
      # here overriding that behavior.
      - name: Delete stale image versions
        id: container-retention-policy
        # Invoked as a direct container reference, pinned by digest, rather
        # than via the `snok/container-retention-policy@<sha>` action alias:
        # that alias only pins the action's metadata commit, while the
        # metadata itself points at the mutable `v3.1.0` container tag it
        # actually executes. Since this container now holds a token capable
        # of deleting organization packages, pinning by digest closes the
        # gap where retagging upstream could substitute a different image.
        uses: docker://ghcr.io/snok/container-retention-policy@sha256:884037f146d6ef574b61fbcc59bef490f887322e6b9dc2eefcf364cb4e9b4112  # v3.1.0
        # A raw `docker://` reference has no action.yaml, so there is no
        # `with:`-to-CLI-flag mapping to rely on: the image's entrypoint is a
        # Rust CLI that only understands `--flag=value` arguments. Inputs are
        # passed via `with.args`, GitHub's documented mechanism for a Docker
        # container step's args (see "jobs.<job_id>.steps[*].with.args" in the
        # workflow syntax reference), which forwards this string to the
        # container's ENTRYPOINT. cut-off and image-tags are double-quoted
        # because their values contain a space (e.g. "4w 2d", "!latest
        # !development"). --shas-to-skip is passed empty rather than omitted:
        # upstream's action.yaml always forwards it to the CLI (empty when its
        # own input is unset), and the CLI's arg parser requires the flag to
        # be present, even with an empty value — confirmed by a live dry-run
        # failing with "the following required arguments were not provided:
        # --image-tags <IMAGE_TAGS>, --shas-to-skip <SHAS_TO_SKIP>" when both
        # flags were omitted outright.
        env:
          RUST_LOG: container_retention_policy=INFO
        with:
          # The default job GITHUB_TOKEN can delete package versions as long
          # as `image-names` is an exact string (not a wildcard), which it is
          # here — no separate PAT is needed. Requires the job-level
          # `permissions: packages: write` above.
          #
          # --image-tags="!latest !development" protects releases and the
          # current main build without needing to enumerate every branch
          # name: per snok/container-retention-policy's matcher semantics
          # (src/core/select_package_versions.rs::filter_by_matchers), a
          # negative pattern matching *any* tag on a package version protects
          # that whole version, regardless of its other tags. Every release
          # build (.github/workflows/ko-build-tag.yaml) tags with `latest`
          # plus its version strings, and the current main build
          # (ko-build-main.yaml) tags with `development` — neither workflow's
          # tags ever share a digest with a plain PR/main SHA-tagged build, so
          # this excludes exactly the versions that must survive and nothing
          # else. Everything else tagged (per-commit SHA + a branch name from
          # ko-build-branch.yaml, or a superseded SHA + `development` pairing
          # from an older main build) is now a deletion candidate once past
          # cut-off, which is the point of widening tag-selection to `both`:
          # previously only fully-untagged versions were ever considered, so
          # per-commit SHA-tagged versions accumulated indefinitely.
          #
          # Known tradeoff: a PR branch whose last push is older than
          # cut-off still carries a live branch-name tag, so its current
          # image is now a deletion candidate too (an idle/abandoned PR, not
          # just superseded commits on an active one). Accepted as normal
          # cleanup of stale PR images; dry-run below guards the rollout.
          #
          # dry-run defaults to true for now, for both triggers: this widens
          # scope to tagged versions for the first time, on top of the
          # existing ~15,000-version untagged backlog, so a maintainer should
          # review a manual dry-run preview before flipping either fallback
          # to 'false'.
          args: >-
            --account=linuxfoundation
            --image-names=lfx-v2-campaign-service/campaign-service
            --image-tags="!latest !development"
            --shas-to-skip=
            --tag-selection=both
            --token=${{ secrets.GITHUB_TOKEN }}
            --cut-off="${{ github.event.inputs.cut-off || '30d' }}"
            --dry-run=${{ github.event.inputs.dry-run || 'true' }}

      - name: Write run summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'true' }}
          CUT_OFF: ${{ github.event.inputs.cut-off || '30d' }}
          DELETED: ${{ steps.container-retention-policy.outputs.deleted }}
          FAILED: ${{ steps.container-retention-policy.outputs.failed }}
        run: |
          {
            echo "### Container image cleanup"
            echo ""
            echo "- Trigger: \`$TRIGGER\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Cut-off: \`$CUT_OFF\`"
            echo "- Deleted: ${DELETED:-(none)}"
            echo "- Failed: ${FAILED:-(none)}"
          } >> "$GITHUB_STEP_SUMMARY"
