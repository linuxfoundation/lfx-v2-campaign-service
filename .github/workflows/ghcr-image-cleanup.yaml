---
name: "Cleanup Stale Container Images"

"on":
  schedule:
    # Sundays at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview candidate deletions without deleting anything."
        type: boolean
        required: false
        default: true
      cut-off:
        description: "Minimum age an image version must reach before it is eligible for deletion (e.g. 30d, 4w 2d)."
        type: string
        required: false
        default: "30d"

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup Stale Container Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # tag-selection=both covers both untagged and tagged versions; account/
      # image-names are fixed rather than exposed as inputs, to keep this job
      # scoped to one package. keep-n-most-recent stays at its default (unused)
      # since cut-off alone already governs what's eligible. Multi-arch child
      # manifests still referenced by a retained parent are protected
      # automatically by snok/container-retention-policy.
      - name: Delete stale image versions
        id: container-retention-policy
        # Pinned by digest (not the `@<sha>` action alias, which only pins
        # action metadata while still executing whatever container tag that
        # metadata points at) since this container holds a token capable of
        # deleting packages.
        uses: docker://ghcr.io/snok/container-retention-policy@sha256:884037f146d6ef574b61fbcc59bef490f887322e6b9dc2eefcf364cb4e9b4112  # v3.1.0
        # A raw `docker://` reference has no action.yaml, so inputs are passed
        # as a single CLI-args string via `with.args` rather than `with:` keys.
        # --shas-to-skip is required by the CLI's arg parser even when empty.
        # --image-tags is quoted because it's space-separated: negative
        # patterns protect any version carrying a matching tag, so "!v*"
        # protects release versions, "!latest" is kept as a defense-in-depth
        # backstop, and "!development" protects the current default-branch
        # build.
        env:
          RUST_LOG: container_retention_policy=INFO
        with:
          # GITHUB_TOKEN can delete package versions when image-names is an
          # exact match (not a wildcard); requires `permissions: packages:
          # write` above. Scheduled runs default dry-run to false so cleanup
          # actually happens; workflow_dispatch still defaults to true so a
          # maintainer can preview a manual run before deleting anything.
          args: >-
            --account=linuxfoundation
            --image-names=lfx-v2-campaign-service/campaign-service
            --image-tags="!v* !latest !development"
            --shas-to-skip=
            --tag-selection=both
            --token=${{ secrets.GITHUB_TOKEN }}
            --cut-off="${{ github.event.inputs.cut-off || '30d' }}"
            --dry-run=${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry-run || 'true' }}

      - name: Write run summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry-run || 'true' }}
          CUT_OFF: ${{ github.event.inputs.cut-off || '30d' }}
          DELETED: ${{ steps.container-retention-policy.outputs.deleted }}
          FAILED: ${{ steps.container-retention-policy.outputs.failed }}
        run: |
          {
            echo "### Container image cleanup"
            echo ""
            echo "- Trigger: \`$TRIGGER\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Cut-off: \`$CUT_OFF\`"
            echo "- Deleted: ${DELETED:-(none)}"
            echo "- Failed: ${FAILED:-(none)}"
          } >> "$GITHUB_STEP_SUMMARY"
