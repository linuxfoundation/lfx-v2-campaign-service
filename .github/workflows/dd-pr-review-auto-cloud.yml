# Event-triggered PR review, posted and approved as @dealako via Copilot CLI.
#
# Replaces the old Anthropic cloud-routine webhook (dd-pr-review-auto-cloud
# Claude skill). Runs on GitHub-hosted infrastructure — no local machine, no
# separate webhook receiver. Review comments and the formal APPROVE /
# REQUEST_CHANGES verdict are posted as @dealako, not as a bot identity.
#
# Who may start this job
# ----------------------
# Same-repo pull requests from active members of
# @linuxfoundation/lfx-platform only. Forks, bots, drafts,
# dealako-authored PRs, and authors who are merely linuxfoundation org
# members (or outside collaborators) are skipped before Copilot starts
# and before DEALAKO_REPO_PAT is exposed to any step. Both the PR author
# and github.actor must pass the team check.
#
# PRs that change this workflow or its prompt are also skipped, even
# when they also change other files. Those edits are human-reviewed;
# Copilot must not review (or rewrite) the job that posts as dealako.
# GitHub `on.paths-ignore` is not enough: it still runs when mixed
# with other paths.
#
# Two separate credentials are in play here, on purpose:
#   - Copilot CLI's own model-call auth uses the workflow's built-in
#     GITHUB_TOKEN (billed to the linuxfoundation org), via the
#     `copilot-requests: write` permission below. No secret required.
#     Requires the org's Copilot policy "Allow use of Copilot CLI billed to
#     the organization" to be enabled (Org > Settings > Copilot > Policies >
#     Copilot CLI) — on by default when Copilot CLI is enabled org-wide.
#   - The actual `gh pr review` / `gh pr comment` calls the agent makes (see
#     .github/copilot-workflows/dd-pr-review-auto-cloud.md) need to post as
#     @dealako, which GITHUB_TOKEN can never do. Those use a separate
#     org-owned fine-grained PAT stored as the repository secret
#     DEALAKO_REPO_PAT:
#       - Resource owner: linuxfoundation (requires org-admin approval)
#       - Repository access: only this repo
#       - Permissions: Pull requests (Read and write), Contents (Read)
#
# These two tokens are deliberately kept in different env vars
# (COPILOT_GITHUB_TOKEN vs. GH_TOKEN) — `copilot` checks COPILOT_GITHUB_TOKEN
# first and `gh` never reads it, so there's no collision between "bill this
# to the org" and "post this as dealako."
#
# The authorize job never receives DEALAKO_REPO_PAT. The review job only
# starts after the team check and the workflow/prompt path check succeed.

name: dd-pr-review-auto-cloud

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dd-pr-review-auto-cloud-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      members: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.authz.outputs.allowed }}
    # Cheap prefilter so we do not spend a runner on PRs we will never review.
    # MEMBER/OWNER = linuxfoundation org membership on this repo. The team
    # check below is stricter (lfx-platform, not the whole org).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dealako' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.fork == false &&
      (github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'OWNER')
    steps:
      - name: Verify team membership and protected paths
        id: authz
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGER: cat
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          ORG: linuxfoundation
          TEAM: lfx-platform
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          membership_state() {
            local user="$1"
            local err
            err="$(mktemp)"
            if gh api "orgs/${ORG}/teams/${TEAM}/memberships/${user}" --jq .state 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            if grep -Eq 'Not Found|"status":\s*"404"|HTTP 404' "$err"; then
              rm -f "$err"
              echo none
              return 0
            fi
            echo "team membership API failed for ${user}:" >&2
            cat "$err" >&2
            rm -f "$err"
            return 1
          }

          allowed=true
          for user in "$AUTHOR" "$ACTOR"; do
            if [[ -z "$user" ]]; then
              echo "skip: empty username"
              allowed=false
              continue
            fi
            state="$(membership_state "$user")"
            if [[ "$state" != "active" ]]; then
              echo "skip: ${user} is not an active member of ${ORG}/${TEAM} (state=${state})"
              allowed=false
            else
              echo "ok: ${user} is an active member of ${ORG}/${TEAM}"
            fi
          done

          # Human-only: do not auto-review PRs that touch this workflow or
          # its prompt, even when they also change other files. Check both
          # filename and previous_filename so a rename still trips the gate.
          changed="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | [.filename, .previous_filename] | .[] | select(. != null and . != "")')"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              .github/workflows/dd-pr-review-auto-cloud.yml|.github/copilot-workflows/dd-pr-review-auto-cloud.md)
                echo "skip: PR touches protected review automation path ${path} (human review only)"
                allowed=false
                ;;
            esac
          done <<< "$changed"

          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"
          if [[ "$allowed" != "true" ]]; then
            echo "Automated review will not start (see skip reasons above)."
          fi

  review:
    name: Copilot PR review (as @dealako)
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # PR HEAD, not the merge ref: conflicted PRs have no merge commit,
          # and Step 5 still needs a tree to review before REQUEST_CHANGES.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0

      - name: Install Copilot CLI
        env:
          COPILOT_TARBALL_SHA512: ytl6vkox1l6Y+UqLhX0+SOuTkS84VCp8R2CJqzgJ8QfnOlWe3U6z1ZVRm/sYWGMLchWQpnC7d+wWZ1mTUTFuuQ==
        run: |
          set -euo pipefail
          tarball="$(npm pack @github/copilot@1.0.86)"
          actual="$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [[ "$actual" != "$COPILOT_TARBALL_SHA512" ]]; then
            echo "Copilot CLI tarball hash mismatch" >&2
            echo "expected: $COPILOT_TARBALL_SHA512" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi
          npm install -g "$tarball"

      - name: Run automated PR review
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.DEALAKO_REPO_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          copilot -p "$(cat .github/copilot-workflows/dd-pr-review-auto-cloud.md)

          Run this routine now. REPO=$REPO PR_NUMBER=$PR_NUMBER TRIGGER=$TRIGGER HEAD_SHA=$HEAD_SHA BASE_SHA=$BASE_SHA" \
            --allow-tool='shell(gh:*)' \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(jq:*)' \
            --allow-tool=read \
            --allow-tool=write \
            --no-ask-user
