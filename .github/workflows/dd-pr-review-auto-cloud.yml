# Event-triggered PR review, posted and approved as @dealako via Copilot CLI.
#
# Replaces the old Anthropic cloud-routine webhook (dd-pr-review-auto-cloud
# Claude skill). Runs on GitHub-hosted infrastructure — no local machine, no
# separate webhook receiver. Review comments and the formal APPROVE /
# REQUEST_CHANGES verdict are posted as @dealako (via a personal access
# token), not as a bot identity.
#
# Setup required before this workflow can run (see
# .github/copilot-workflows/dd-pr-review-auto-cloud.md for the full review
# spec followed by the prompt below):
#
#   1. Create a fine-grained PAT owned by @dealako, scoped to this repo, with:
#      - "Copilot Requests" permission (for Copilot CLI auth/billing)
#      - "Pull requests: Read and write" (to post reviews/comments)
#      - "Contents: Read" (to check out the repo)
#   2. Store it as the repository secret DEALAKO_PAT
#      (Settings > Secrets and variables > Actions).

name: dd-pr-review-auto-cloud

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dd-pr-review-auto-cloud-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Copilot PR review (as @dealako)
    runs-on: ubuntu-latest
    # Defense-in-depth: the prompt re-checks both conditions itself (Step 1),
    # but skipping here avoids spending a Copilot CLI run on PRs we know we
    # won't review.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dealako'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run automated PR review
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.DEALAKO_PAT }}
          GH_TOKEN: ${{ secrets.DEALAKO_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER: ${{ github.event.action == 'synchronize' && 'synchronize' || 'opened' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          copilot -p "$(cat .github/copilot-workflows/dd-pr-review-auto-cloud.md)

          Run this routine now. REPO=$REPO PR_NUMBER=$PR_NUMBER TRIGGER=$TRIGGER HEAD_SHA=$HEAD_SHA" \
            --allow-tool='shell(gh:*)' \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(jq:*)' \
            --allow-tool=read \
            --allow-tool=write \
            --no-ask-user
