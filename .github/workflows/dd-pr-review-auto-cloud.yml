# Event-triggered PR review, posted and approved as @dealako via Copilot CLI.
#
# Replaces the old Anthropic cloud-routine webhook (dd-pr-review-auto-cloud
# Claude skill). Runs on GitHub-hosted infrastructure — no local machine, no
# separate webhook receiver. Review comments and the formal APPROVE /
# REQUEST_CHANGES verdict are posted as @dealako, not as a bot identity.
#
# Two separate credentials are in play here, on purpose:
#   - Copilot CLI's own model-call auth uses the workflow's built-in
#     GITHUB_TOKEN (billed to the linuxfoundation org), via the
#     `copilot-requests: write` permission below. No secret required.
#     Requires the org's Copilot policy "Allow use of Copilot CLI billed to
#     the organization" to be enabled (Org > Settings > Copilot > Policies >
#     Copilot CLI) — on by default when Copilot CLI is enabled org-wide.
#   - The actual `gh pr review` / `gh pr comment` calls the agent makes (see
#     .github/copilot-workflows/dd-pr-review-auto-cloud.md) need to post as
#     @dealako, which GITHUB_TOKEN can never do. Those use a separate
#     org-owned fine-grained PAT stored as the repository secret
#     DEALAKO_REPO_PAT:
#       - Resource owner: linuxfoundation (requires org-admin approval)
#       - Repository access: only this repo
#       - Permissions: Pull requests (Read and write), Contents (Read)
#
# These two tokens are deliberately kept in different env vars
# (COPILOT_GITHUB_TOKEN vs. GH_TOKEN) — `copilot` checks COPILOT_GITHUB_TOKEN
# first and `gh` never reads it, so there's no collision between "bill this
# to the org" and "post this as dealako."

name: dd-pr-review-auto-cloud

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: dd-pr-review-auto-cloud-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Copilot PR review (as @dealako)
    runs-on: ubuntu-latest
    # Defense-in-depth: the prompt re-checks draft and self-authored itself
    # (Step 1), but skipping here avoids spending a Copilot CLI run on PRs
    # we know we won't review. Forks are skipped because pull_request
    # workflows from forks do not receive repository secrets (same guard as
    # ko-build-branch.yaml).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dealako' &&
      github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          # PR HEAD, not the merge ref: conflicted PRs have no merge commit,
          # and Step 5 still needs a tree to review before REQUEST_CHANGES.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.86

      - name: Run automated PR review
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.DEALAKO_REPO_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          copilot -p "$(cat .github/copilot-workflows/dd-pr-review-auto-cloud.md)

          Run this routine now. REPO=$REPO PR_NUMBER=$PR_NUMBER TRIGGER=$TRIGGER HEAD_SHA=$HEAD_SHA BASE_SHA=$BASE_SHA" \
            --allow-tool='shell(gh:*)' \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(jq:*)' \
            --allow-tool=read \
            --allow-tool=write \
            --no-ask-user
