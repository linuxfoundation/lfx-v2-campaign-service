---
# image is the configuration for the container images
image:
  # repository is the container image repository
  repository: ghcr.io/linuxfoundation/lfx-v2-campaign-service/campaign-service
  # tag is the container image tag (overrides appVersion from Chart.yaml)
  tag: ""
  # pullPolicy is the image pull policy
  pullPolicy: IfNotPresent

# replicaCount is the number of replicas for the deployment. This chart's
# default is 1; deployments may and do set more (production runs 3), and
# nothing here refuses that.
#
# The Reddit reporting budget (internal/platform/reddit/report_budget.go) does
# not depend on this: since #380 its ledger is shared in Postgres, so every
# replica together spends at most 45 report requests a minute against an ad
# account's 60 — see templates/deployment.yaml for the history, including why
# a render-time replica guard was the wrong answer.
replicaCount: 1

# podAnnotations are additional annotations applied to the pod template.
#
# The Prometheus scrape annotations are set by DEFAULT (LFXV2-3221): the service
# serves the Prometheus text format at /metrics on the same port as the API, so a
# prometheus.io/scrape discovery-based collector picks the pod up with no further
# configuration. The port is quoted because Kubernetes annotation values must be
# strings; an unquoted 8080 renders as an integer and the annotation is rejected.
#
# /metrics is deliberately NOT added to the HTTPRoute or the Heimdall RuleSet — it
# is scraped in-cluster (pod IP), exactly like the /livez and /readyz probes, and
# must not be reachable through the public gateway.
#
# Add further annotations here as needed; anything set replaces this default, so a
# deployment overriding podAnnotations must re-declare the scrape keys to keep
# being scraped.
#
# prometheus.io/port is NOT set here, and is RESERVED. The template derives it from
# service.port so the two cannot drift: a deployment that changes service.port would
# otherwise keep a hardcoded 8080 here and be scraped on a port nothing listens on.
# Setting it under podAnnotations has NO effect — the template omits that one key from
# this map before merging it, so the derived value always wins. Every other annotation
# set here passes through untouched.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"

# podLabels are additional labels applied to the pod template.
# Example:
#   team: platform
#   environment: production
podLabels: {}

# podDisruptionBudget configures a PodDisruptionBudget for the deployment.
# Only one of minAvailable or maxUnavailable may be set (not both).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# topologySpreadConstraints controls how pods are spread across nodes/zones.
# Empty by default (no constraints). Set per-environment (e.g. in the GitOps
# global values) to spread replicas across hosts/zones for high availability.
# Example:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: lfx-v2-campaign-service
topologySpreadConstraints: []

# resources is the configuration for container resource requests and limits
resources:
  # limits is the maximum amount of resources allowed
  limits:
    cpu: 500m
    memory: 512Mi
  # requests is the minimum amount of resources required
  requests:
    cpu: 100m
    memory: 128Mi

# traefik is the configuration for Traefik Gateway API routing
traefik:
  # gateway specifies the platform Gateway to attach to
  gateway:
    # name is the name of the Gateway resource
    name: lfx-platform-gateway
    # namespace is the namespace of the Gateway resource
    namespace: lfx

# lfx is the configuration for LFX platform
lfx:
  # domain is the base domain for routing
  domain: k8s.orb.local
  # namespace is the target namespace for deployment
  namespace: lfx

# service is the configuration for the Kubernetes service
service:
  # port is the service port
  port: 8080

# networkPolicy restricts ingress to the service pods. Disabled for local development.
networkPolicy:
  enabled: false
  ingress:
    from: []

# openfga is the configuration for the OpenFGA server
openfga:
  # enabled is a boolean to determine if the OpenFGA server should be enabled for authorization
  # Note: If it is disabled, then the service will allow all requests
  # (Disabling OpenFGA should only be used for local development).
  enabled: true

# heimdall is the configuration for the heimdall middleware
heimdall:
  enabled: true
  url: http://lfx-platform-heimdall.lfx.svc.cluster.local:4456
  # jwksUrl is the URL to the JSON Web Key Set endpoint for JWT validation
  jwksUrl: http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks
  # add_middleware determines whether or not the middleware is installed. If not managed
  # by another service or helm chart then it is needed.
  add_middleware: false

# authelia is the configuration for the Authelia server
authelia:
  # enabled is a boolean to determine if the Authelia authenticator is enabled
  # Note: Disabling Authelia should only be used for local development
  enabled: true

# nats is the configuration for the NATS server
nats:
  # url is the URL of the NATS server
  url: nats://lfx-platform-nats.lfx.svc.cluster.local:4222

# app is the configuration for the application
app:
  # logLevel is the log level (debug, info, warn, error)
  logLevel: debug
  # logAddSource is a boolean to determine if the log source should be added
  logAddSource: true
  # use_oidc_contextualizer is a boolean to determine if the OIDC contextualizer should be used
  use_oidc_contextualizer: true
  # jwt is the configuration for JWT authentication
  # audience is the intended audience for the JWT token
  audience: lfx-v2-campaign-service

  # extraEnv allows injecting additional environment variables into the container.
  # Supports both simple key-value pairs and Kubernetes field references.
  # These are rendered BEFORE OTEL variables, allowing use in OTEL configuration.
  extraEnv: []

  # otel is the configuration for OpenTelemetry tracing
  otel:
    # serviceName is the service name for OpenTelemetry resource identification
    # (default: "lfx-v2-campaign-service")
    # TODO(agaetep): will comments still get flushed out with values?
    serviceName: ""
    # serviceVersion is the service version for OpenTelemetry resource identification
    # (default: build-time Version variable)
    serviceVersion: ""
    # protocol specifies the OTLP protocol: "grpc" or "http"
    # (default: "grpc")
    protocol: "grpc"
    # endpoint is the OTLP collector endpoint
    # For gRPC: typically "host:4317", for HTTP: typically "host:4318"
    endpoint: ""
    # insecure disables TLS for the OTLP connection
    # Set to "true" for in-cluster communication without TLS
    insecure: "false"
    # tracesExporter specifies the traces exporter: "otlp" or "none"
    # (default: "none")
    tracesExporter: "none"
    # tracesSampler specifies the OTEL_TRACES_SAMPLER type. Supported values:
    # "always_on", "always_off", "traceidratio", "parentbased_always_on",
    # "parentbased_always_off", "parentbased_traceidratio".
    # When empty, the application defaults to parentbased_traceidratio (which
    # honors upstream parent sampling decisions).
    tracesSampler: ""
    # tracesSamplerArg specifies the OTEL_TRACES_SAMPLER_ARG (sampler ratio for
    # traceidratio / parentbased_traceidratio; 0.0 to 1.0, defaults to 1.0 if empty).
    # (default: "")
    tracesSamplerArg: ""
    # metricsExporter specifies the metrics exporter: "otlp" or "none"
    # (default: "none")
    metricsExporter: "none"
    # logsExporter specifies the logs exporter: "otlp" or "none"
    # (default: "none")
    logsExporter: "none"
    # propagators specifies the trace context propagators to use
    # Comma-separated list of: "tracecontext", "baggage", "jaeger"
    # (default: "tracecontext,baggage")
    propagators: "tracecontext,baggage,jaeger"

  # environment contains all application environment variables
  # Each variable can have either a 'value' (for direct values) or 'valueFrom' (for secret references)
  environment:
    # NATS_URL is the URL of the NATS server (required)
    NATS_URL:
      value: nats://lfx-platform-nats.lfx.svc.cluster.local:4222

    # LOG_LEVEL is the log level (debug, info, warn, error) - optional, defaults to info
    LOG_LEVEL:
      value: info

    # LOG_ADD_SOURCE determines if log source should be added - optional, defaults to true
    LOG_ADD_SOURCE:
      value: true

    # UPLOAD_MEMORY_BUDGET_BYTES sizes the ONE per-pod memory budget that creative-asset
    # uploads draw on (the wire side of each upload plus its decoded pixel buffer, #179).
    # Optional and normally left UNSET: the service then uses 40% of the container memory
    # limit it reads from the cgroup, so overriding resources.limits.memory resizes the budget
    # with it. Set it only to pin a size: a byte count or a binary quantity (e.g. 256Mi). A
    # malformed value stops the pod at startup. Never below 192Mi (one worst-case upload); a
    # smaller value is raised to that and logged. 80Mi of it is kept for decoded pixel buffers.
    # Uploads beyond the budget wait briefly (at most ~500ms), then get 503 with Retry-After; usage is exported as campaign_upload_memory_budget_in_use_bytes.
    # UPLOAD_MEMORY_BUDGET_BYTES:
    #   value: 256Mi

    # JWKS_URL is the URL to the JSON Web Key Set endpoint for JWT validation
    # Required unless JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL is set
    JWKS_URL:
      value: http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks

    # JWT_AUDIENCE is the intended audience for the JWT token (required)
    JWT_AUDIENCE:
      value: lfx-v2-campaign-service

    # JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL disables JWT validation entirely and treats every
    # request as the named principal. Local development only, and ENFORCED as such at two
    # layers. (1) Template time: the guard at the top of templates/deployment.yaml FAILS the
    # render if this is given a non-empty value, so a deploy carrying the bypass cannot be
    # produced at all. (2) Runtime: a pod that somehow starts with it set REFUSES TO BOOT and
    # logs which key to unset.
    #
    # The runtime half depends on the service knowing it is in a cluster, and that is NOT
    # from KUBERNETES_SERVICE_HOST alone. This chart renders every app.environment key and
    # appends app.extraEnv verbatim, and an explicit container env entry overrides the
    # kubelet's — so that variable IS chart-settable, and one override could otherwise both
    # enable the bypass and hide the cluster. The template guard therefore also rejects any
    # KUBERNETES_* name in either input, and the service ORs in a second signal the
    # environment cannot express (the projected service-account directory).
    #
    # Leave it empty. It stays declared only so the key is discoverable; the empty default is
    # pinned by the parity test's exempt list.
    JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL:
      value: ''

    # AUTH_SOURCE is the authentication source: 'jwt' for production, 'mock' for local dev (optional, defaults to jwt)
    AUTH_SOURCE:
      value: jwt

    # REPOSITORY_SOURCE is the repository implementation: 'nats' for production, 'mock' for local dev
    # Optional, defaults to nats. Production should use 'nats', local development should use 'mock'
    REPOSITORY_SOURCE:
      value: nats

    EVENTING_ENABLED:
      value: "true"

    # Opt-in for Reddit campaign metrics reads. Default OFF: Reddit's reporting
    # endpoint has no public documentation (LFXV2-2995), so the request shape,
    # response shape, and spend currency unit the client uses are a best-effort
    # GUESS. While this is "false", the metrics endpoint answers 400 for Reddit
    # campaigns — the accurate response for an unverified contract — instead of a
    # 200 that looks authoritative but may carry wrong numbers. Any value other
    # than "true" is treated as off, so a typo fails closed.
    # Flip to "true" only after the shape is verified against a live Reddit ad
    # account; at that point the gate is removed and this key goes away.
    # The same flag gates the Reddit audience and keyword performance reads
    # (reddit-ads/audience, reddit-ads/keywords, LFXV2-2665), which run on the
    # same reporting operation with breakdowns.
    # Their reporting budget (Reddit's 60 report requests a minute per ad
    # account; this service takes at most 45, shared across replicas in Postgres)
    # is ALSO spent by the ungated Reddit account monitor, so turning this flag
    # off does not bound that budget.
    REDDIT_METRICS_ENABLED:
      value: "false"

    # The HubSpot workflow a survey send series (POST /projects/{project_id}/send-workflows) is
    # copied from when the request names no source_workflow_url. The copy keeps its schedule,
    # sending windows and suppression lists and gets the series' own drafts and audience; the
    # source is only ever read. Empty selects the in-code default (1841232183, the LF Research
    # survey-promo workflow in the LF portal), which exists in that one portal only — a
    # deployment whose projects connect other portals should set its own, or callers must
    # always pass source_workflow_url.
    SURVEY_SEQUENCE_WORKFLOW_ID:
      value: ""

    # Opts this deployment IN to Microsoft Advertising metrics reads. Default off
    # for the same reason as REDDIT_METRICS_ENABLED above: the v13 Reporting
    # contract was implemented from Microsoft's published documentation and has
    # NOT been exercised against a live Microsoft Advertising account, so a
    # guessed request/response shape would return a 200 that looks authoritative.
    # Microsoft's pipeline is also unlike every other platform's — an
    # asynchronous submit/poll/download returning a zipped CSV — so there is more
    # surface to be wrong about than a single JSON GET. Any value other than
    # "true" is treated as off, so a typo fails closed.
    # Flip to "true" only after the shape is verified against a live Microsoft
    # ad account; at that point the gate is removed and this key goes away.
    MICROSOFT_METRICS_ENABLED:
      value: "false"

    # Opts this deployment IN to microsoftConfig.headlines, descriptions,
    # path1 and path2 (#563), the caller copy of the Microsoft responsive
    # search ad, sent instead of the auto-composed copy. Default off: the
    # shape is built from the v13 ResponsiveSearchAd reference and no live
    # create has sent caller copy or Path1/Path2. It names no account
    # resource; it keeps an unverified shape off the shared ad account. While
    # off, a create naming any of the four is refused with a 400 before any
    # job exists. Any value other than "true" is treated as off, so a typo
    # fails closed.
    MICROSOFT_AD_COPY_ENABLED:
      value: "false"

    # Opts this deployment IN to microsoftConfig.negativeKeywords (#563):
    # campaign-level negative keywords attached right after a Microsoft
    # Advertising campaign is created, through the AddNegativeKeywordsToEntities
    # call the add-negative-keywords lever makes. Default off: no live create
    # has made that call. It names no account resource; it keeps an unverified
    # create-path call off the shared ad account. While off, a create naming a
    # non-empty list is refused with a 400 before any job exists. Any value
    # other than "true" is treated as off, so a typo fails closed.
    MICROSOFT_CREATE_NEGATIVE_KEYWORDS_ENABLED:
      value: "false"

    # Opts this deployment IN to BOTH Reddit ad-group targeting writes
    # (LFXV2-2665): removing keywords (remove-keyword-targeting) and adding
    # negative keywords to excluded_keywords (add-negative-keywords) — enabling
    # it enables both. Default off: Reddit
    # replaces an ad group's targeting object as a whole, so the write sends
    # back every dimension it read, and that round trip has not been exercised
    # against a live Reddit ad account. While off, both endpoints answer 400 for
    # Reddit campaigns; the keyword-targeting READ is not gated. Any value other
    # than "true" is treated as off, so a typo fails closed.
    REDDIT_KEYWORD_TARGETING_WRITES_ENABLED:
      value: "false"

    # Opts this deployment IN to redditConfig.conversionEvent (#549): the
    # pixel event (SIGN_UP, LEAD, PURCHASE, ...) a conversions campaign
    # optimizes toward, sent as the campaign's and ad group's
    # optimization_goal instead of the default PURCHASE. Default off: no live
    # create has confirmed Reddit accepts a goal other than PURCHASE on a
    # CONVERSIONS campaign under budget optimization. While off, a create that
    # sets the field is refused with a 400 before any job exists; one that
    # omits it is unaffected. Not role-gated: it names no account resource.
    # Any value other than "true" is treated as off, so a typo fails closed.
    REDDIT_CONVERSION_EVENT_ENABLED:
      value: "false"

    # Opts this deployment IN to Reddit custom audiences (#549): the create
    # inputs redditConfig.customAudienceIds / excludedCustomAudienceIds and the
    # picker read reddit-ads/custom-audiences. Built from Reddit's public v3
    # OpenAPI document and NOT exercised against a live ad account; ops turns
    # it on by setting it to exactly "true" in lfx-v2-argocd after a live
    # create confirms it. While off, a create naming an audience is refused
    # with 400 before any job exists and the read answers 400. The audiences
    # live on the ad account every foundation shares, so create-campaigns also
    # requires global_marketing_ops for them (403 without it) and the read is
    # in the gateway's marketing-ops-api rule. Any value other than "true" is
    # treated as off, so a typo fails closed.
    REDDIT_CUSTOM_AUDIENCES_ENABLED:
      value: "false"

    # Opts this deployment IN to redditConfig.excludedSubreddits and
    # redditConfig.excludedGeoTargets (#549), sent at create time as the ad
    # group's excluded_communities and excluded_geolocations. Default off: the
    # shape is built from Reddit's published v3 targeting schema and no live
    # create has sent it. It names no account resource; it keeps an unverified
    # shape off the shared ad account. While off, a create naming either list
    # is refused with a 400 before any job exists. Any value other than "true"
    # is treated as off, so a typo fails closed.
    REDDIT_TARGETING_EXCLUSIONS_ENABLED:
      value: "false"

    # Opts this deployment IN to resolving redditConfig.subreddits and
    # redditConfig.interests before create (#549): communities confirmed with
    # GET /targeting/communities and interests resolved to ids with
    # GET /targeting/interests, as a synchronous 400 for an unknown value and
    # again at dispatch, fail-closed. Neither read has been exercised against a
    # live account. While off, values are sent as given, with the ad-group 400
    # fallback. Any value other than "true" is treated as off.
    REDDIT_TARGETING_RESOLUTION_ENABLED:
      value: "false"

    # Opts this deployment IN to Reddit VIDEO posts (#549):
    # redditConfig.videoAssetId (a stored video/mp4) and thumbnailAssetId (a
    # stored PNG/JPEG), authored as a VIDEO post whose video and thumbnail
    # Reddit fetches from short-lived signed URLs (the video URL serves only
    # video/mp4). Needs the signed creative-asset URLs configured too.
    # Default off: the post shape is built from Reddit's published v3 schema
    # and no live create has sent it. While off, a create naming either field
    # is refused with a 400 before any job exists. Any value other than "true"
    # is treated as off, so a typo fails closed.
    REDDIT_VIDEO_ENABLED:
      value: "false"

    # Opts this deployment IN to twitterConfig.geoTargets, languages, keywords
    # and interestIds (#564), sent at create time as LOCATION, LANGUAGE,
    # BROAD_KEYWORD and INTEREST targeting criteria on the new X line item.
    # Default off: the
    # shape is built from X's published v12 reference and no live create has
    # sent it. It names no account resource; it keeps an unverified shape off
    # the shared ad account. While off, a create naming any of the lists is
    # refused with a 400 before any job exists. Any value other than "true" is
    # treated as off, so a typo fails closed.
    TWITTER_CREATE_TARGETING_ENABLED:
      value: "false"

    # Opts this deployment IN to X custom audiences (#564): the create inputs
    # twitterConfig.customAudienceIds / excludedCustomAudienceIds (CUSTOM_AUDIENCE
    # targeting criteria, EQ and NE, on the new line item) and the picker read
    # twitter-ads/custom-audiences. Built from X's published v12 reference and not
    # yet exercised against a live ad account. While off, a create setting either
    # list is refused with a 400 before any job exists and the read answers 400.
    # The audiences live on the ad account every foundation shares, so the create
    # inputs also need global_marketing_ops (403 otherwise) and the read is gated
    # on it at the gateway. Any value other than "true" is treated as off.
    TWITTER_CUSTOM_AUDIENCES_ENABLED:
      value: "false"

    # Opts this deployment IN to conversions in the Meta metrics read (#550):
    # for a campaign this service created with the conversions objective, the
    # Insights read also requests `actions` and reports the recorded event's
    # action type as conversions. Read-only, but the event-to-action-type
    # mapping has not been checked against a live account and a wrong one would
    # publish a false zero. While off, Meta conversions stay unavailable, as
    # before. Any value other than "true" is treated as off.
    META_CONVERSIONS_METRICS_ENABLED:
      value: "false"

    # Opts this deployment IN to microsoftConfig.sitelinks and
    # microsoftConfig.callouts (#563), created at create time as sitelink and
    # callout ad extensions associated with the new Search campaign. Default
    # off: the shape is built from the v13 Campaign Management reference and no
    # live create has sent it. It names no account resource. While off, a
    # create naming either list is refused with a 400 before any job exists.
    # Any value other than "true" is treated as off, so a typo fails closed.
    MICROSOFT_AD_EXTENSIONS_ENABLED:
      value: "false"

    # Opts this deployment IN to microsoftConfig.audienceIds,
    # excludedAudienceIds and audienceBidAdjustment (#563): remarketing lists
    # observed (bid only) and excluded on the new ad group. Built from the v13
    # Campaign Management reference and not yet sent by a live create. While
    # off, a create naming any of the three is refused with a 400 before any job
    # exists. The lists live on the account every foundation shares, so they
    # also need global_marketing_ops (403 otherwise). Any value other than
    # "true" is treated as off.
    MICROSOFT_AUDIENCES_ENABLED:
      value: "false"

    # Opts this deployment IN to microsoftConfig.excludedGeoTargets,
    # proximityTargets and languages (#563): excluded countries and radius
    # targets on the new campaign, and its ad languages. Built from the v13
    # Campaign Management reference and not yet sent by a live create. They
    # name no account resource. While off, a create naming any of the three is
    # refused with a 400 before any job exists. Any value other than "true" is
    # treated as off.
    MICROSOFT_CREATE_TARGETING_ENABLED:
      value: "false"

    # Opts this deployment IN to googleAdsConfig.demandGenAudience (#459): one
    # existing Google Ads Audience on a Demand Gen ad group. The same flag
    # gates each googleAdsConfig.demandGenAdGroups[].audience (#460), the same
    # input on a named ad group. A per-deployment opt-in, off by default; ops
    # turns it on by setting it to exactly "true" in lfx-v2-argocd. The service
    # checks the Audience against the connected Google Ads account (same
    # customer id). That account is shared by every foundation and
    # campaign_manager includes foundation executive directors, so
    # create-campaigns also requires global_marketing_ops on the project for
    # any Demand Gen audience (checked over NATS; 403 without it).
    # While off, a create naming one is refused before anything upstream exists;
    # the rest of Demand Gen, languages and ad groups without an audience
    # included, is unaffected. Any value other
    # than "true" is treated as off, so a typo fails closed.
    GOOGLE_ADS_DEMAND_GEN_AUDIENCE_ENABLED:
      value: "false"

    # Opts this deployment IN to the Display audience lists that name an
    # account-owned segment (#462): googleAdsConfig.audienceSegments on the
    # "display" channel, customAudiences and customAffinities, and (#475) the
    # user-list exclusions excludedAudienceSegments plus each displayAdGroups
    # entry's audienceSegments, customAudiences, customAffinities and
    # excludedAudienceSegments. A per-deployment opt-in, off by default, like
    # GOOGLE_ADS_DEMAND_GEN_AUDIENCE_ENABLED; set it to exactly "true" in
    # lfx-v2-argocd to turn it on. The service checks each segment against the
    # connected Google Ads account (same customer id), which every foundation
    # shares, so create-campaigns also requires global_marketing_ops on the
    # project for any of these fields (checked over NATS; 403 without it).
    # While off, a create naming one is refused before anything upstream
    # exists. userInterests (Google's own categories, at either level),
    # excludedPlacements (public domains), Search's observation-only
    # audienceSegments and displayAdGroups entries without those lists are
    # not behind this flag (Search audienceSegments still need
    # global_marketing_ops). Any value other than "true" is treated as off, so a typo
    # fails closed.
    GOOGLE_ADS_DISPLAY_AUDIENCES_ENABLED:
      value: "false"

    # Opt this deployment IN to metaConfig.callToAction (the button on every Meta
    # ad, e.g. SIGN_UP or BUY_TICKETS instead of LEARN_MORE) and
    # metaConfig.conversionEvent (the conversions objective's custom_event_type,
    # e.g. COMPLETE_REGISTRATION instead of PURCHASE), #550. Off by default until
    # the payloads are verified against a live ad account; set exactly "true" in
    # lfx-v2-argocd. While off, a create carrying the field is refused with a 400
    # before any job exists. Neither names an account resource, so neither needs
    # global_marketing_ops. Any value other than "true" is treated as off.
    META_CALL_TO_ACTION_ENABLED:
      value: "false"
    META_CONVERSION_EVENT_ENABLED:
      value: "false"

    # Opts this deployment IN to metaConfig.targeting (#550): age, gender,
    # custom audiences to include and exclude, and the Advantage+ audience
    # flag on the Meta ad set. A per-deployment opt-in, off by default, because
    # the payloads were built from Meta's docs and are not yet live-verified;
    # set it to exactly "true" in lfx-v2-argocd to turn it on. Each custom
    # audience is read and must belong to the connected Meta ad account before
    # anything is created. That account is shared by every foundation, so
    # create-campaigns also requires global_marketing_ops on the project for the
    # audience lists (checked over NATS; 403 without it). While off, a create
    # carrying a targeting block is refused with a 400 before any job exists.
    # Any value other than "true" is treated as off, so a typo fails closed.
    META_AUDIENCE_TARGETING_ENABLED:
      value: "false"

    # Opts this deployment IN to googleAdsConfig.performanceMaxAudienceSignal
    # (#461): one existing Google Ads Audience attached to a Performance Max
    # asset group as a signal. A per-deployment opt-in, off by default, like
    # GOOGLE_ADS_DEMAND_GEN_AUDIENCE_ENABLED; set it to exactly "true" in
    # lfx-v2-argocd to turn it on. The service checks the Audience against the
    # connected Google Ads account (same customer id), which every foundation
    # shares, so create-campaigns also requires global_marketing_ops on the
    # project for a signal (checked over NATS; 403 without it).
    # While off, a create naming one is refused before anything upstream
    # exists. Search themes and the Performance Max sitelinks, callouts and
    # structured snippets are unaffected. Any value other than "true" is
    # treated as off, so a typo fails closed.
    GOOGLE_ADS_PMAX_AUDIENCE_SIGNAL_ENABLED:
      value: "false"

    # Opts this deployment IN to googleAdsConfig.sharedNegativeKeywordLists
    # (#477): existing shared negative keyword lists (sharedSets) attached to
    # a Search campaign. A per-deployment opt-in, off by default, like
    # GOOGLE_ADS_DEMAND_GEN_AUDIENCE_ENABLED; set it to exactly "true" in
    # lfx-v2-argocd to turn it on. The service checks each shared set against
    # the connected Google Ads account (same customer id), which every
    # foundation shares, so create-campaigns also requires global_marketing_ops
    # on the project for any shared list (checked over NATS; 403 without it).
    # While off, a create naming one is refused before anything upstream exists.
    # searchAssets (images, logo, business name) is unaffected. Any value
    # other than "true" is treated as off, so a typo fails closed.
    GOOGLE_ADS_SHARED_NEGATIVE_LISTS_ENABLED:
      value: "false"

    # Opts this deployment IN to the Google Ads demographic inputs not yet
    # exercised by a live (persisted) create: googleAdsConfig.observedDemographics
    # (#497), displayDemographics (#499) and demandGenDemographics (#498: its create
    # body was accepted by a validateOnly probe on 2026-11-05; a persisted create and
    # the read-back its reuse relies on are not yet verified). Unlike the gates above it names
    # no account resource; it keeps an unverified shape off the shared account,
    # because a wrong guess fails after the budget and campaign exist. Set it to
    # exactly "true" in lfx-v2-argocd once the probe passes. While off, a create
    # naming one is refused before anything upstream exists. Any value other than
    # "true" is treated as off, so a typo fails closed.
    GOOGLE_ADS_DEMOGRAPHIC_TARGETING_ENABLED:
      value: "false"

    # Opts this deployment IN to linkedInConfig.conversions (#552): conversion
    # rule ids associated with the campaign through a Campaign Conversions PUT
    # once it exists. The PUT has not been exercised against a live LinkedIn
    # account. The ids also require global_marketing_ops on the project. Set it
    # to exactly "true" in lfx-v2-argocd once the probe in the PR passes. While
    # off, a create naming conversions is refused before a job exists. Any value
    # other than "true" is treated as off, so a typo fails closed.
    LINKEDIN_ADS_CONVERSIONS_ENABLED:
      value: "false"

    # Opts this deployment IN to the X (Twitter) Ads ACCOUNT MONITOR
    # (/projects/{project_id}/connection-twitter-ads/account-monitor). Default
    # off for the same reason as MICROSOFT_METRICS_ENABLED above: the X account
    # monitor AND the X audience read (twitter-ads/audience) both use X's
    # asynchronous stats-jobs API (active_entities, job create, job status, a
    # downloaded gzip results file, segmentation), implemented from X's
    # published documentation and NOT exercised against a live X Ads account.
    # It gates both stats-job features; X's per-campaign metrics read is
    # unaffected. Any value
    # other than "true" is treated as off, so a typo fails closed.
    # Flip to "true" only after the contract is verified against a live X ad
    # account; at that point the gate is removed and this key goes away.
    # Those features' limits are per process: at runtime only the pod holding a
    # per-account Postgres advisory lease creates X stats jobs (others answer
    # 503). With replicaCount > 1 (or autoscaling past one) the chart renders
    # and templates/NOTES.txt prints a warning; it does not refuse (#381).
    # ArgoCD never shows that warning, and at three replicas most X audience
    # reads land on a non-owner pod and 503: run one replica with the flag on.
    TWITTER_METRICS_ENABLED:
      value: "false"

    # Makes the LF-owned SYSTEM marketing-ops connection the PRIMARY credential for
    # every paid-ads provider, instead of the per-project connection. Default off.
    #
    # This is not a fallback: while it is "true" a project's own ad account is not
    # consulted at all, and a project that explicitly DISCONNECTED its account is
    # still dispatched on the system account. It therefore changes WHICH advertising
    # account real money is spent from — flip it only with that understood.
    #
    # Fails closed in both directions: any value other than "true" is off, so a typo
    # disables forcing rather than enabling it; and with forcing on, a missing or
    # unusable system connection is a not-created error rather than a silent
    # fall-through to the project connection the flag exists to ignore.
    #
    # HubSpot is never forced — forcing redirects ad-ACCOUNT selection, which the email
    # channel has no equivalent of. It reaches the LF portal by the ordinary fallback
    # instead (credsSource.systemConn), never by this flag.
    LFX_FORCE_SYSTEM_ADS_ACCOUNT:
      value: "false"

    # Comma-separated NETWORK-SPECIFIC RFC 6052 NAT64 prefixes for this cluster,
    # e.g. "2001:db8:64::/96". Empty is correct for a cluster with no NAT64, and is
    # the default because a wrong value is worse than none.
    #
    # It cannot be defaulted to anything useful: a network-specific prefix is carved
    # from the operator's OWN global unicast space, so it is undiscoverable in-process
    # and indistinguishable from any other public prefix. The event-URL fetcher always
    # decodes the well-known 64:ff9b::/96; on a cluster that uses a network-specific
    # prefix instead, leaving this empty is a live SSRF hole — the TRANSLATOR makes the
    # IPv4 connection, so an address encoding 169.254.169.254 passes every check inside
    # the service. Set it wherever NAT64 is in use.
    #
    # Only RFC 6052 lengths are accepted (/32, /40, /48, /56, /64, /96). Anything else
    # PANICS at startup rather than decoding at the wrong offset for the pod's lifetime.
    EVENT_URL_NAT64_PREFIXES:
      value: ""

    # How long a TERMINAL campaign job (succeeded, partial or failed) is kept before
    # the retention sweeper deletes it. A Go duration string; "4320h" is 180 days.
    #
    # campaign_jobs is otherwise append-only — nothing else in the service ever deletes
    # a row — so without this the table grows with every brief dispatch forever, and the
    # stuck-job recovery sweep pays for that growth on every pass.
    #
    # Deliberately LONG, and deliberately explicit here rather than left to the code
    # default, so the retention actually in force for a deployment is visible in the
    # values file. These rows are the audit trail of real ad spend: a job records that a
    # brief was dispatched, to which platforms, and what each one returned. Shorten it
    # only against a stated retention requirement — the cost of keeping a row too long
    # is disk, while the cost of deleting one too early is an unrecoverable gap in the
    # spend record.
    #
    # Only TERMINAL jobs are ever eligible. A queued or running row is never deleted at
    # any age: an old non-terminal row is a STUCK job, which is exactly the record an
    # operator needs in order to investigate a dispatch that never finished.
    #
    # An unset, empty, unparseable ("30 days", "7d" — neither is a valid Go duration) or
    # non-positive value falls back to the 180-day default rather than to a short window,
    # so a typo here cannot cause early deletion.
    CAMPAIGN_JOB_RETENTION:
      value: "4320h"

    # AES-256-GCM key for encrypting ad-platform connection credentials at rest.
    # Required whenever a database URL is configured (PG* / DATABASE_URL), because
    # NewContainer initializes the encryptor before opening the pool used by
    # /readyz. Secret key must be a base64-encoded 32-byte value.
    # Rollout prerequisite: ExternalSecret / secret sync must provision
    # `credential-encryption-key` on lfx-v2-campaign-service-secrets before
    # deploying this chart revision (otherwise CreateContainerConfigError).
    # Local/dev sample (NOT for production): see README / values.local.example.yaml.
    CREDENTIAL_ENCRYPTION_KEY:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: credential-encryption-key

    # SNOWFLAKE_* configure the read-only warehouse lookup that resolves an event's PAST
    # EDITIONS, which is what makes audience groups 5 and 7 (past-edition registrants) possible.
    # ALL of account/user/privateKey are required for the lookup to run; with any missing, every
    # audience is built COUNTRY-ONLY and the plan records that no past editions were resolved.
    #
    # Optional refs so a cluster without the secret still starts: the warehouse is a read-only
    # enrichment, and failing pod start over it would take down campaign dispatch for a feature
    # that degrades cleanly. The cost of leaving it unset is a narrower audience, not an outage.
    #
    # Rollout prerequisite: ExternalSecret / secret sync must provision `snowflake-account`,
    # `snowflake-user` and `snowflake-private-key` on lfx-v2-campaign-service-secrets before
    # groups 5 and 7 will build.
    SNOWFLAKE_ACCOUNT:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: snowflake-account
          optional: true
    SNOWFLAKE_USER:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: snowflake-user
          optional: true
    # The PEM private key for key-pair auth. A secret ref, never a value: it is a credential.
    SNOWFLAKE_PRIVATE_KEY:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: snowflake-private-key
          optional: true
    # Warehouse and role are not secrets, but are environment-specific; empty means "use the
    # account default", which is what a dev cluster wants.
    SNOWFLAKE_WAREHOUSE:
      value: ''
    SNOWFLAKE_ROLE:
      value: ''

    # AI_* configure the LF LiteLLM proxy used to GENERATE email copy (subject, preheader,
    # body, CTA) via the POST /projects/{id}/briefs/{id}/email-copy endpoint. Optional as a
    # GROUP: with either URL or key missing, the endpoint returns 503 (service unavailable).
    # The credential is the PROXY's key, not a Bedrock or Anthropic key. Rollout
    # prerequisite: secret sync must provision `ai-proxy-url` and `ai-api-key` on
    # lfx-v2-campaign-service-secrets before copy generation will be available.
    AI_PROXY_URL:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: ai-proxy-url
          optional: true
    AI_API_KEY:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: ai-api-key
          optional: true
    # Not a secret: the model id the proxy routes on. Empty selects llm.DefaultModel.
    AI_MODEL:
      value: ''

    # Signed creative-asset URLs (LFXV2-2665): lets a Reddit dispatch use an image stored
    # through upload-creative-asset. Reddit only accepts a PUBLIC image URL it fetches, so the
    # service serves the stored bytes at a short-lived HMAC-signed URL on the public gateway
    # (/_campaigns/creative-assets/..., anonymous by design — see ruleset.yaml) and passes it
    # to Reddit. Optional as a PAIR: with the key or the base URL unset the feature is OFF (the
    # route 404s and a Reddit config naming imageAssetId is refused with a 400). A value that
    # is SET but unusable fails startup, even while its other half is still unset.
    #
    # Rollout prerequisite: ExternalSecret / secret sync must provision
    # `creative-asset-url-signing-key` (standard base64 of >= 32 random bytes, e.g.
    # `openssl rand -base64 32`) on lfx-v2-campaign-service-secrets, AND the overlay must set
    # CREATIVE_ASSET_PUBLIC_BASE_URL to the https origin of this environment's public gateway
    # (the lfx-api host this chart's HTTPRoute serves), reachable by Reddit from the internet.
    # Rotating the key invalidates only URLs minted in the last TTL.
    CREATIVE_ASSET_URL_SIGNING_KEY:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: creative-asset-url-signing-key
          optional: true
    # https origin only (no path/query); empty keeps the feature off. e.g. https://lfx-api.<domain>
    CREATIVE_ASSET_PUBLIC_BASE_URL:
      value: ''
    # Lifetime of a minted URL (Go duration, 5m..60m). Minted just before the promoted-post
    # request; the 5m floor covers that request, Reddit's fetch and clock skew.
    CREATIVE_ASSET_URL_TTL:
      value: "10m"

    # INDEXER_SERVICE_TOKEN is the SERVICE credential the index relay stamps onto
    # messages it replays from the outbox. Outbox rows deliberately store no token
    # (the table is JSONB retained for audit with no pruning, so a per-request JWT
    # written there would persist as a live credential), and the indexer REJECTS any
    # message without a non-empty authorization header.
    #
    # Marked optional so a cluster whose secret does not yet carry the key still
    # starts: the relay detects the missing credential and idles, leaving outbox rows
    # PENDING rather than draining them into a black hole. Nothing is lost, but
    # indexing recovery stays DISABLED until this is provisioned — a terminal write
    # like archiving a brief has no later write to repair the index with.
    #
    # Rollout prerequisite: ExternalSecret / secret sync must provision
    # `indexer-service-token` on lfx-v2-campaign-service-secrets.
    INDEXER_SERVICE_TOKEN:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: indexer-service-token
          optional: true

    # INDEXER_RESOLVE_PROJECT_UID, when exactly "true", makes the index relay key every
    # indexed brief and campaign on the project UID (#590). OpenFGA keys projects by UID,
    # so a document whose access_check_object is `project:<slug>` matches no
    # campaign_manager tuple and the Query Service shows it to nobody. The relay resolves
    # the slug over NATS (lfx.projects-api.slug_to_uid) at publish time; parent_refs keeps
    # `project:<slug>` beside `project:<uid>`, so a reader filtering by either finds it. A
    # failed lookup leaves the row pending. Any other value is off.
    #
    # ROLLOUT ORDER: turn this on BEFORE indexer-service-token is provisioned. The relay
    # publishes and retires the whole outbox backlog as soon as it has a token, so a
    # backlog drained with this off is indexed slug-keyed and is not replayed when the
    # flag is turned on later. The service logs a warning when it has a token and this
    # is off.
    INDEXER_RESOLVE_PROJECT_UID:
      value: "false"

    # PostgreSQL connection settings from the ExternalSecret-managed secret
    # (keys: host, port, username, password, dbname, engine). The app composes
    # the DSN in-process so the password is not interpolated into the pod spec.
    # Secret name/namespace in lfx-v2-dev: lfx-v2-campaign-service-secrets
    # in namespace lfx-v2-campaign-service.
    PGHOST:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: host
    PGPORT:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: port
          # Optional: app defaults to 5432 when unset (same pattern as PGENGINE).
          optional: true
    PGUSER:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: username
    PGPASSWORD:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: password
    PGDATABASE:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: dbname
    # Optional in the app (empty default). Mark optional so a secret without
    # an `engine` key does not block pod start.
    PGENGINE:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-campaign-service-secrets
          key: engine
          optional: true

# serviceAccount is the configuration for the Kubernetes service account (used by multiple components)
serviceAccount:
  # create specifies whether a service account should be created
  create: true
  # name is the name of the service account to use.
  # If not set and create is true, defaults to the chart name.
  name: ""
  # annotations to add to the service account
  annotations: {}
  # automountServiceAccountToken is a boolean to determine if the service account token should be automatically mounted
  automountServiceAccountToken: true
