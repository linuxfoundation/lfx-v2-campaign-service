---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
  hostnames:
    - "lfx-api.{{ .Values.lfx.domain }}"
  rules:
    # Project-nested campaign API (the approved contract — every endpoint is
    # /projects/{projectId}/…, gated on the project `campaign_manager` relation).
    #
    # project-service owns `PathPrefix: /projects/`, so we cannot claim that
    # prefix. The distinguishing token (connection-*, briefs, jobs, the metrics
    # provider segment, hubspot) sits AFTER the variable {projectId}, which a
    # PathPrefix/Exact match cannot reach past. We therefore use a
    # RegularExpression path match to select exactly this service's project-nested
    # subpaths; project-service's /projects/ routes are unaffected (Traefik resolves
    # overlap by match specificity — the regex only matches campaign subpaths).
    #
    # REQUIRES Traefik >= v3.1.0 (the platform gateway): its Gateway API provider
    # translates a `RegularExpression` HTTPRoute path match into a native
    # `PathRegexp(...)` router rule (RE2 / Go regexp flavor) — verified in Traefik's
    # source (buildPathRule) for every v3.1.0+ tag. NOTE: v3.0.x does NOT support it
    # (it returns "unsupported path match"), and the feature is not listed in
    # Traefik's Gateway API conformance report even though the code implements it —
    # so after deploy, confirm this HTTPRoute's `Accepted` status condition is True
    # rather than assuming the render alone means it routes.
    #
    # The trailing wildcard is per-family and MUST mirror the RuleSet
    # (ruleset.yaml `project-api`) exactly, or the route would forward sub-paths
    # Heimdall has no rule for (a route/rule parity violation — an unruled path is
    # denied, or worse). Only briefs/jobs/hubspot carry `**` in the RuleSet, so
    # only they get the free `(/.*)?` tail here. The connection-* family is ruled
    # for exactly the base, /test, and /set-credential sub-paths; per-provider
    # /metrics and google-ads/keywords|audience are ruled at the base path only.
    #
    # google-ads, meta-ads, linkedin-ads, microsoft-ads and twitter-ads are spelled out
    # separately from the rest of the family because they carry one extra ruled
    # sub-path the others do not have: /accounts (account discovery). Folding /accounts
    # into the shared alternation would admit it for every provider, and a path the
    # RuleSet does not rule is a route/rule parity violation.
    #
    # reddit-ads remains in the shared branch because its platform client has no
    # ListAdAccounts, so its dispatcher does not implement AccountLister and the
    # endpoint does not exist. When it gains discovery, move it to the discovery branch
    # here AND add its path to the RuleSet. Only once EVERY provider in the shared
    # branch has /accounts ruled does collapsing them back into one alternation become
    # correct — and with reddit-ads the only member left, "the shared branch" is now a
    # single provider, so that collapse is one ticket away and must still not be done
    # early.
    #
    # hubspot is spelled out separately for the same reason, but its extra sub-paths are
    # /emails and /campaigns, NOT /accounts: a HubSpot connection is already scoped to the
    # portal its token authenticates against, so there is no account to discover — what the
    # caller picks is which marketing email a campaign clones (LFXV2-3197) and which existing
    # HubSpot campaign owns the UTM token (LFXV2-2641). It therefore cannot join the discovery
    # branch; admitting /accounts for hubspot would rule a path the service does not serve, and
    # /emails or /campaigns for google-ads or meta-ads the same.
    - matches:
      - path:
          type: RegularExpression
          value: ^/projects/[^/]+/(connection-(google-ads|meta-ads|linkedin-ads|microsoft-ads|twitter-ads)(/(test|set-credential|accounts))?|connection-hubspot(/(test|set-credential|emails|campaigns))?|connection-reddit-ads(/(test|set-credential))?|(briefs|jobs|hubspot)(/.*)?|fetch-event-url|(google-ads|linkedin-ads|meta-ads|reddit-ads|twitter-ads)/metrics|google-ads/(keywords|audience|campaign-ref))$
      {{- if .Values.heimdall.enabled }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: heimdall-forward-body
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
          weight: 1
    # OpenAPI spec + reserved placeholder prefix (served directly by the service).
    - matches:
      - path:
          type: Exact
          value: /campaigns
      - path:
          type: PathPrefix
          value: /campaigns/
      - path:
          type: PathPrefix
          value: /_campaigns/
      {{- if .Values.heimdall.enabled }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: heimdall-forward-body
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
          weight: 1
