---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
  hostnames:
    - "lfx-api.{{ .Values.lfx.domain }}"
  rules:
    # Project-nested campaign API (the approved contract — every endpoint is
    # /projects/{projectId}/…, gated on the project `campaign_manager` relation).
    #
    # project-service owns `PathPrefix: /projects/`, so we cannot claim that
    # prefix. The distinguishing token (connection-*, briefs, jobs, the provider
    # segment, hubspot) sits AFTER the variable {projectId}, which a
    # PathPrefix/Exact match cannot reach past. We therefore use a
    # RegularExpression path match to select exactly this service's project-nested
    # subpaths; project-service's /projects/ routes are unaffected (Traefik resolves
    # overlap by match specificity — the regex only matches campaign subpaths).
    #
    # REQUIRES Traefik >= v3.1.0 (the platform gateway): its Gateway API provider
    # translates a `RegularExpression` HTTPRoute path match into a native
    # `PathRegexp(...)` router rule (RE2 / Go regexp flavor) — verified in Traefik's
    # source (buildPathRule) for every v3.1.0+ tag. NOTE: v3.0.x does NOT support it
    # (it returns "unsupported path match"), and the feature is not listed in
    # Traefik's Gateway API conformance report even though the code implements it —
    # so after deploy, confirm this HTTPRoute's `Accepted` status condition is True
    # rather than assuming the render alone means it routes.
    #
    # The trailing wildcard is per-family and MUST mirror the RuleSet
    # (ruleset.yaml `project-api`) exactly, or the route would forward sub-paths
    # Heimdall has no rule for (a route/rule parity violation — an unruled path is
    # denied, or worse). Only briefs/jobs/hubspot carry `**` in the RuleSet, so
    # only they get the free `(/.*)?` tail here — which is also what routes every
    # per-campaign path below a brief, including the Meta ad-set read and pause/resume
    # (campaigns/{id}/meta-ad-sets[/{adSetId}/status|/{adSetId}/ads], LFXV2-2665), with no branch of its own. The connection-* family is ruled
    # for exactly the base, /test, and /set-credential sub-paths;
    # google-ads/keywords|audience|campaign-ref|geo-targets|user-lists, microsoft-ads/keywords|audience|campaign-ref,
    # (linkedin-ads|meta-ads|reddit-ads|twitter-ads)/audience, reddit-ads/keywords and (meta-ads|reddit-ads|twitter-ads|linkedin-ads)/campaign-ref are
    # ruled at the base path only. There is NO per-provider /metrics branch: the chart used to
    # route (google-ads|linkedin-ads|meta-ads|reddit-ads|twitter-ads)/metrics, but no design/
    # method serves it — metrics are per campaign and per brief, under briefs/ — so it was
    # removed from this regex and the RuleSet together (2026-10-13).
    #
    # google-ads, meta-ads, linkedin-ads, microsoft-ads, twitter-ads and reddit-ads — every
    # ad provider — share ONE discovery branch carrying /accounts (account discovery) and
    # /account-monitor (the account-scoped monitor endpoints). reddit-ads was its own branch
    # (/account-monitor without /accounts) until LFXV2-2665 gave it account discovery
    # (reddit.ListAdAccounts, RedditDispatcher.ListAccounts); it joined this branch and its
    # /accounts path was ruled in the RuleSet in the same change. microsoft-ads and
    # twitter-ads have report-backed monitors (AccountReportReader — see the
    # account-monitor architecture concept).
    #
    # The branch still names its providers rather than matching any connection-*: hubspot
    # must not gain /accounts (see below), and a path the RuleSet does not rule is a
    # route/rule parity violation.
    #
    # hubspot is spelled out separately for the same reason, but its extra sub-paths are
    # /emails, /campaigns and /account-monitor, NOT /accounts: a HubSpot connection is already
    # scoped to the portal its token authenticates against, so there is no account to discover —
    # what the caller picks is which marketing email a campaign clones (LFXV2-3197) and which
    # existing HubSpot campaign owns the UTM token (LFXV2-2641). Its /account-monitor
    # (LFXV2-2665) is the email monitor: project-scoped to the emails this service recorded, with
    # no account_id. It therefore cannot join the discovery branch; admitting /accounts for
    # hubspot would rule a path the service does not serve, and /emails or /campaigns for
    # google-ads or meta-ads the same.
    #
    # audience-builder (LFXV2-2770) is a sibling of /briefs, not a descendant, so it
    # inherits nothing and needs its own alternation branch here plus its own RuleSet
    # entries. Its thirteen leaves are enumerated instead of taking a free `(/.*)?` tail:
    # compose-master and custom/create write real contact lists into a production
    # HubSpot portal and are NOT idempotent, so admitting a path the service does not
    # serve is worse here than for a read family. Five leaves are two segments deep
    # (lists/search, qa/run, custom/interpret|preview|create), which is why a
    # single-segment placeholder would not have covered the family either.
    - matches:
      - path:
          type: RegularExpression
          value: ^/projects/[^/]+/(connection-(google-ads|meta-ads|linkedin-ads|microsoft-ads|twitter-ads|reddit-ads)(/(test|set-credential|accounts|account-monitor))?|connection-hubspot(/(test|set-credential|emails|campaigns|account-monitor))?|(briefs|jobs|hubspot)(/.*)?|fetch-event-url|google-ads/(keywords|audience|campaign-ref|geo-targets|user-lists)|microsoft-ads/(keywords|audience|campaign-ref)|(linkedin-ads|meta-ads|reddit-ads|twitter-ads)/audience|reddit-ads/keywords|(meta-ads|reddit-ads|twitter-ads|linkedin-ads)/campaign-ref|audience-builder/(capabilities|discover|lists/search|suppression-lists|last-sent|existing-master-lists|preview-count|compose-master|attach-existing|qa/run|custom/(interpret|preview|create)))$
      {{- if .Values.heimdall.enabled }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: heimdall-forward-body
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
          weight: 1
    # OpenAPI spec + reserved placeholder prefix (served directly by the service).
    # The /_campaigns/ PathPrefix below also carries the signed creative-asset route
    # (LFXV2-2665): /_campaigns/creative-assets/{projectId}/{briefId}/{assetId}, the public
    # URL Reddit fetches a stored image from. It needs no branch of its own — the prefix
    # already forwards it through Heimdall — and Heimdall's dedicated ANONYMOUS rule
    # (ruleset.yaml `signed-creative-asset:get`, GET/HEAD only) is what admits it; every other
    # /_campaigns/** path stays deny_all. parity_test.go pins both halves.
    - matches:
      - path:
          type: Exact
          value: /campaigns
      - path:
          type: PathPrefix
          value: /campaigns/
      - path:
          type: PathPrefix
          value: /_campaigns/
      {{- if .Values.heimdall.enabled }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: heimdall-forward-body
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
          weight: 1
