{{- /*
  Guard: neither env input may enable the auth bypass, and neither may declare a
  KUBERNETES_* name.

  Both halves are needed together, and neither is sufficient alone. The service refuses to
  boot when JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL is set AND it detects a cluster, and it
  detects the cluster partly from KUBERNETES_SERVICE_HOST. An explicit container env entry
  takes precedence over the kubelet's service variables, so an override that set the
  principal AND declared KUBERNETES_SERVICE_HOST: "" would clear the discriminator and get
  a pod that accepts any token as that principal. `app.environment` renders every key it is
  given and `app.extraEnv` is appended verbatim, so both are reachable from values.

  Failing at TEMPLATE time is the point: the deploy cannot render, so there is no window in
  which a cluster is running the bypass. The runtime keeps its own second cluster signal
  (config.runningInCluster) for deploys that never pass through this chart.
*/}}
{{- $reservedPrefix := "KUBERNETES_" }}
{{- $bypassKey := "JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL" }}
{{- range $name, $config := .Values.app.environment }}
  {{- if hasPrefix $reservedPrefix $name }}
    {{- fail (printf "app.environment.%s is reserved: the kubelet injects the KUBERNETES_* variables, and declaring one here overrides it. This service reads KUBERNETES_SERVICE_HOST to refuse the %s auth bypass in a deployment, so a chart-set value could conceal the cluster. Remove it." $name $bypassKey) }}
  {{- end }}
{{- end }}
{{- with (get .Values.app.environment $bypassKey) }}
  {{- /*
      valueFrom is rejected outright rather than inspected. Its value lives in a Secret or
      a field reference resolved by the kubelet, so the template cannot see whether it is
      empty — and "cannot see" must not read as "is empty" for the one key that turns
      authentication off. There is no legitimate reason to source a LOCAL-DEVELOPMENT
      principal from a cluster Secret, so refusing the whole form costs nothing.
  */}}
  {{- /*
      `default ""` is NOT usable here. Helm's `default` treats boolean false and numeric 0
      as empty, so `--set-json ...value=false` rendered `value: "false"` — a perfectly
      non-empty container env var — while the guard saw "" and let the Deployment through.
      `kindIs "invalid"` is the nil test that survives Helm's scalar typing: it is true only
      for an absent or explicitly-null value, and false for every scalar the renderer would
      go on to stringify.
  */}}
  {{- if or (and (not (kindIs "invalid" .value)) (trim (toString .value))) .valueFrom }}
    {{- fail (printf "app.environment.%s must stay empty, and may not use valueFrom. It DISABLES JWT verification and attributes every request to the named principal; it exists for local development only. A pod that starts with it set refuses to boot, so setting it here cannot deploy the bypass — it can only break the deploy." $bypassKey) }}
  {{- end }}
{{- end }}
{{- range $entry := .Values.app.extraEnv }}
  {{- $n := toString (default "" $entry.name) }}
  {{- if hasPrefix $reservedPrefix $n }}
    {{- fail (printf "app.extraEnv entry %q is reserved: see the app.environment guard. Declaring a KUBERNETES_* variable overrides the kubelet's, which would conceal the cluster from the %s guard." $n $bypassKey) }}
  {{- end }}
  {{- /* valueFrom rejected for the same reason as in the app.environment guard above. */}}
  {{- /* kindIs rather than default, for the false/0 reason given in the guard above. */}}
  {{- if and (eq $n $bypassKey) (or (and (not (kindIs "invalid" $entry.value)) (trim (toString $entry.value))) $entry.valueFrom) }}
    {{- fail (printf "app.extraEnv may not set %s to a non-empty value or source it with valueFrom: it disables JWT verification. See the app.environment guard." $bypassKey) }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  annotations:
    # TRANSITIONAL WORKAROUND (tracked in linuxfoundation/lfx-self-serve#1541; removed by
    # linuxfoundation/lfx-self-serve#1544). This annotation exists only to flip a PRE-EXISTING
    # RollingUpdate Deployment to Recreate; a freshly created object never needs it. It is
    # dropped once schema migrations move out of pod boot into a PreSync Job and the Deployment
    # returns to RollingUpdate. Note the cost while it is here: Replace=true makes ArgoCD PUT
    # (replace) this Deployment every sync instead of applying it, so a live field the manifest
    # omits is removed and SSA field-ownership is bypassed. Concretely spec.replicas: the chart
    # pins it and the Application sets ignoreDifferences:/spec/replicas (RespectIgnoreDifferences),
    # so an ordinary sync leaves an out-of-band scale or HPA value alone but a full replace
    # overwrites it back to replicaCount -- low risk today (no HPA, replicaCount 1).
    #
    # Replace=true makes ArgoCD apply this Deployment with `kubectl replace` instead of a
    # strategic-merge / server-side-apply patch. Required because `strategy.type` below is
    # Recreate: when an existing object is flipped from the RollingUpdate default, the API
    # server's defaulted `strategy.rollingUpdate` block (maxSurge/maxUnavailable) is owned by
    # no field manager, so SSA will not strip it, and `rollingUpdate` may not coexist with
    # `type: Recreate` -- the apply is rejected with "may not be specified when strategy `type`
    # is 'Recreate'". A full replace discards the orphaned field, so the cutover self-heals
    # without a manual `kubectl patch`.
    #
    # Replace=true is MERGED into any operator-supplied sync-options rather than emitted as a
    # bare literal: since `argocd.argoproj.io/sync-options` is one comma-separated value, an
    # override that sets it for another reason would otherwise be a duplicate map key and win
    # last, silently dropping Replace=true and reopening the forbidden-cutover failure. Merging
    # keeps the operator's options AND guarantees Replace=true is present. Every other
    # operator annotation renders unchanged beneath.
    {{- $annotations := deepCopy (default (dict) .Values.annotations) }}
    {{- $syncOptions := compact (splitList "," (index $annotations "argocd.argoproj.io/sync-options" | default "")) }}
    {{- if not (has "Replace=true" $syncOptions) }}
    {{- $syncOptions = append $syncOptions "Replace=true" }}
    {{- end }}
    {{- $_ := set $annotations "argocd.argoproj.io/sync-options" (join "," $syncOptions) }}
    {{- toYaml $annotations | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # TRANSITIONAL (removed by linuxfoundation/lfx-self-serve#1544): Recreate, and the
  # Replace=true annotation above, are retained for one release but are NO LONGER load-bearing.
  # Schema migrations moved out of pod boot into a PreSync hook Job
  # (templates/migrate-job.yaml, linuxfoundation/lfx-self-serve#1543); the server now only
  # VERIFIES the schema at startup and never mutates it.
  #
  # The old rationale: boot-time migrations under RollingUpdate let the surged NEW pod migrate
  # the shared DB (e.g. 000014's backward-incompatible drop of UNIQUE (brief_id, platform))
  # while the OLD pod still served the incompatible schema; Recreate terminated the old pod
  # first. With migrations in a PreSync Job that hazard is closed by a different mechanism --
  # expand/contract keeps every pending migration N-1-safe (see the migrations README) -- and
  # Recreate would not have protected the PreSync case anyway, since PreSync applies the
  # migration BEFORE the rollout while the old pods are still serving.
  #
  # Kept here only so #1543 and #1544 stay independently verifiable; #1544 returns this to
  # RollingUpdate and drops the Replace=true annotation.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Chart.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Chart.Name }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          {{- range $name, $config := .Values.app.environment }}
          - name: {{ $name }}
            {{- /*
                Use hasKey (not truthiness) so a deliberate `value: ""` renders as an
                explicit empty string rather than collapsing to a bare `- name: FOO`.
            */}}
            {{- if hasKey $config "value" }}
            value: {{ $config.value | quote }}
            {{- else if $config.valueFrom }}
            valueFrom:
              {{- toYaml $config.valueFrom | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- with .Values.app.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- $otelServiceName := .Values.app.otel.serviceName | toString | trim }}
          {{- if ne $otelServiceName "" }}
          - name: OTEL_SERVICE_NAME
            value: {{ $otelServiceName | quote }}
          {{- end }}
          {{- $otelServiceVersion := .Values.app.otel.serviceVersion | toString | trim }}
          {{- if ne $otelServiceVersion "" }}
          - name: OTEL_SERVICE_VERSION
            value: {{ $otelServiceVersion | quote }}
          {{- end }}
          {{- $otelEndpoint := .Values.app.otel.endpoint | toString | trim }}
          {{- if ne $otelEndpoint "" }}
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ $otelEndpoint | quote }}
          {{- end }}
          {{- $otelProtocol := .Values.app.otel.protocol | toString | trim }}
          {{- if ne $otelProtocol "" }}
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: {{ $otelProtocol | quote }}
          {{- end }}
          {{- $otelInsecure := .Values.app.otel.insecure | toString | trim }}
          {{- if ne $otelInsecure "" }}
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: {{ $otelInsecure | quote }}
          {{- end }}
          {{- $otelTracesExporter := .Values.app.otel.tracesExporter | toString | trim }}
          {{- if ne $otelTracesExporter "" }}
          - name: OTEL_TRACES_EXPORTER
            value: {{ $otelTracesExporter | quote }}
          {{- end }}
          {{- $otelTracesSampler := .Values.app.otel.tracesSampler | toString | trim }}
          {{- if ne $otelTracesSampler "" }}
          - name: OTEL_TRACES_SAMPLER
            value: {{ $otelTracesSampler | quote }}
          {{- end }}
          {{- $otelTracesSamplerArg := .Values.app.otel.tracesSamplerArg | toString | trim }}
          {{- if ne $otelTracesSamplerArg "" }}
          - name: OTEL_TRACES_SAMPLER_ARG
            value: {{ $otelTracesSamplerArg | quote }}
          {{- end }}
          {{- $otelMetricsExporter := .Values.app.otel.metricsExporter | toString | trim }}
          {{- if ne $otelMetricsExporter "" }}
          - name: OTEL_METRICS_EXPORTER
            value: {{ $otelMetricsExporter | quote }}
          {{- end }}
          {{- $otelLogsExporter := .Values.app.otel.logsExporter | toString | trim }}
          {{- if ne $otelLogsExporter "" }}
          - name: OTEL_LOGS_EXPORTER
            value: {{ $otelLogsExporter | quote }}
          {{- end }}
          {{- $otelPropagators := .Values.app.otel.propagators | toString | trim }}
          {{- if ne $otelPropagators "" }}
          - name: OTEL_PROPAGATORS
            value: {{ $otelPropagators | quote }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: web
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            failureThreshold: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            # Once /readyz reflects the DB pool (connection PRs), a single
            # transient ping failure — e.g. a CloudNativePG failover — should not
            # immediately flip the pod NotReady. Tolerate a few consecutive
            # failures before removing it from the Service endpoints.
            failureThreshold: 3
            periodSeconds: 10
            # Align with readinessProbeTimeout (2s) in internal/service, plus
            # margin for HTTP handling. Kubernetes default is 1s.
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: web
            # ~90s budget for a cold start where the DB (CloudNativePG) may still
            # be coming up. This is real because the process no longer exits when
            # the DB is unreachable at boot: NewContainer boots in 503 mode and
            # retries migration/pool in the background, so /readyz stays 503 (not a
            # crash) until the DB is up and this probe keeps the pod alive across
            # the window. See internal/container/container.go.
            failureThreshold: 90
            periodSeconds: 1
            timeoutSeconds: 3
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
